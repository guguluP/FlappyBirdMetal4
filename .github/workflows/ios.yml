name: iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build and test (iOS Simulator)
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("no iPhone simulator")
          ')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project "FlappyBirdMetal4.xcodeproj" \
            -scheme "FlappyBirdMetal4" \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -only-testing:"FlappyBirdMetal4Tests" \
            CODE_SIGNING_ALLOWED=NO
